version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gosec
    - misspell
  exclusions:
    generated: lax # ocsf_gen.go (its OCSF descriptions are upstream prose)

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/luupback/ocsf]
