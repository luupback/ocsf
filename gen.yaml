# What cmd/ocsfgen generates Go types for (ocsf_gen.go). Each of classes
# and objects is either a list of OCSF names or "all" (every one in the
# schema). With a list, a class or object not listed has no type, and an
# attribute whose object is not listed is left out of its struct (the
# generated file lists every omission); a required attribute's object must
# be listed. Extension classes and objects are named as in the schema
# (win/registry_key_activity) and generated with their prefix
# (WinRegistryKeyActivity).
classes: all
objects: all
# Profiles whose attributes are generated (none: base classes only).
profiles: []
